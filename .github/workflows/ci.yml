name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Matches the project's Dart 3.12 SDK constraint (pubspec.yaml).
          flutter-version: "3.44.2"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
