name: Android release bundle

# Manual trigger: builds a signed .aab (and optionally split APKs) on a Linux
# runner with a complete toolchain — no local Android SDK/NDK needed.
#
# One-time setup — add these repository secrets (Settings → Secrets and
# variables → Actions):
#   KEYSTORE_BASE64   base64 of android/app/upload-keystore.jks
#                     PowerShell:
#                       [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\app\upload-keystore.jks")) > ks.txt
#                     then paste the contents of ks.txt
#   KEYSTORE_PASSWORD store password from android/key.properties
#   KEY_PASSWORD      key password (same value unless you changed it)
#   KEY_ALIAS         key alias — "upload"
on:
  workflow_dispatch:
    inputs:
      build_apks:
        description: "Also build split APKs (for sideload testing)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable

      # NDK is what local Windows builds were missing; install the exact
      # version Flutter pins so debug symbols can be stripped.
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — see the setup notes at the top of this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get
      - run: flutter build appbundle --release

      - name: Build split APKs
        if: ${{ inputs.build_apks }}
        run: flutter build apk --release --split-per-abi

      # Verify what we actually produced, so a mis-signed or mis-named build
      # is caught here rather than by Play Console.
      - name: Verify bundle
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$JAVA_HOME/bin/jarsigner" -verify -verbose:summary \
            build/app/outputs/bundle/release/app-release.aab | tail -3
          unzip -p build/app/outputs/bundle/release/app-release.aab \
            base/manifest/AndroidManifest.xml > /tmp/m.pb || true
          echo "--- bundle built:"; ls -la build/app/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: sheben-n1-release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
