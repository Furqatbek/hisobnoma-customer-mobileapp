<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hisobnoma Shop — Mobile Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8E8E6; }
  * { box-sizing: border-box; }
  .shop-noscrollbar::-webkit-scrollbar { display: none; }
  #root *::-webkit-scrollbar { display: none; }
  #root * { scrollbar-width: none; }
  input::placeholder, textarea::placeholder { color: rgba(60,60,67,0.45); }
  select:focus, input:focus, textarea:focus { outline: none; }
  button { font: inherit; }

  @keyframes shopSpin { to { transform: rotate(360deg); } }
  @keyframes shopShimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  @keyframes shopPop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes shopFadeUp {
    0% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes shopFadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes shopSlideInRight {
    0% { transform: translateX(100%); }
    100% { transform: translateX(0); }
  }
  @keyframes shopSlideInLeft {
    0% { transform: translateX(-30%); opacity: 0.6; }
    100% { transform: translateX(0); opacity: 1; }
  }
  @keyframes shopBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="shop-data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shop-ui.jsx"></script>
<script type="text/babel" src="shop-catalog.jsx"></script>
<script type="text/babel" src="shop-cart.jsx"></script>
<script type="text/babel" src="shop-account.jsx"></script>
<script type="text/babel" src="shop-extras.jsx"></script>
<script type="text/babel" src="shop-wishlist.jsx"></script>
<script type="text/babel" src="shop-app.jsx"></script>
</body>
</html>
